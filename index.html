
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Skin Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: #fff7fa;
    color: #684b57;
}

header {
    background: white;
    text-align: center;
    padding: 25px;
    box-shadow: 0 3px 15px #f2dce5;
}

header h1 {
    color: #d987a4;
    font-size: 32px;
}

header p {
    margin-top: 8px;
    font-size: 13px;
}

.hero {
    text-align: center;
    padding: 65px 20px;
    background: linear-gradient(135deg, #f8dce7, #fff4f8);
}

.hero h2 {
    font-size: 35px;
    color: #bd718e;
}

.hero p {
    margin-top: 12px;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

form {
    background: white;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 5px 25px #efd9e2;
}

form h2 {
    text-align: center;
    color: #ce819d;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: 600;
    margin: 18px 0 9px;
}

input[type="text"],
input[type="email"],
input[type="tel"],
select,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #edcbd8;
    border-radius: 10px;
    outline: none;
    background: #fffafd;
    color: #684b57;
}

input:focus, select:focus, textarea:focus {
    border-color: #d987a4;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.options label {
    background: #fff1f6;
    padding: 13px;
    border-radius: 10px;
    margin: 0;
    cursor: pointer;
    font-weight: normal;
}

.options input {
    accent-color: #d987a4;
    margin-right: 6px;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #fff1f6;
    border-radius: 10px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    background: #d987a4;
    border: none;
    border-radius: 30px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #bd6f8e;
    transform: translateY(-2px);
}

#result {
    display: none;
    background: white;
    padding: 25px;
    margin-top: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #efd9e2;
    line-height: 2;
    overflow-wrap: anywhere;
}

#result h2 {
    color: #ce819d;
}

#preview {
    max-width: 100%;
    max-height: 250px;
    margin-top: 12px;
    border-radius: 12px;
    display: none;
}

footer {
    text-align: center;
    padding: 25px;
    background: #f9e1e9;
    color: #9c6178;
}

@media(max-width:600px) {
    .hero h2 {
        font-size: 27px;
    }

    form {
        padding: 22px;
    }

    .options {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Glow Skin Studio ♡</h1>
    <p>Your Skin, Your Beauty, Your Confidence</p>
</header>

<section class="hero">
    <h2>Let's Understand Your Skin 💗</h2>
    <p>Share your skin concerns and let us understand your skincare needs.</p>
</section>

<div class="container">

<form id="skinForm">

    <h2>Skin Consultation Form 🌸</h2>

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your name" required>

    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="Enter phone number">

    <label>Your Age</label>
    <input type="number" id="age" min="1" max="120" placeholder="Enter your age">

    <label>Your Skin Type</label>
    <select id="skinType" required>
        <option value="">Select skin type</option>
        <option>Oily Skin</option>
        <option>Dry Skin</option>
        <option>Combination Skin</option>
        <option>Sensitive Skin</option>
        <option>Normal Skin</option>
        <option>Not Sure</option>
    </select>

    <label>Your Skin Concerns</label>

    <div class="options">
        <label><input type="checkbox" value="Acne / Pimples"> Acne / Pimples</label>
        <label><input type="checkbox" value="Dark Spots"> Dark Spots</label>
        <label><input type="checkbox" value="Pigmentation"> Pigmentation</label>
        <label><input type="checkbox" value="Dryness"> Dryness</label>
        <label><input type="checkbox" value="Wrinkles"> Wrinkles</label>
        <label><input type="checkbox" value="Open Pores"> Open Pores</label>
        <label><input type="checkbox" value="Redness"> Redness</label>
        <label><input type="checkbox" value="Dull Skin"> Dull Skin</label>
        <label><input type="checkbox" value="Dark Circles"> Dark Circles</label>
        <label><input type="checkbox" value="Uneven Skin Tone"> Uneven Skin Tone</label>
    </div>

    <label>How long have you had this skin condition?</label>
    <select id="duration">
        <option value="">Select duration</option>
        <option>Less than 1 month</option>
        <option>1-3 months</option>
        <option>3-6 months</option>
        <option>More than 6 months</option>
        <option>Several years</option>
    </select>

    <label>Do you currently use skincare products?</label>
    <select id="products">
        <option value="">Select an option</option>
        <option>Yes</option>
        <option>No</option>
    </select>

    <label>Describe Your Skin Condition</label>
    <textarea id="description" rows="5"
    placeholder="Tell us more about your skin condition..."></textarea>

    <label>Upload Your Skin Picture</label>
    <input type="file" id="skinImage" accept="image/*">
    <img id="preview" alt="Skin image preview">

    <button type="submit">Submit My Skin Details ♡</button>

</form>

<div id="result"></div>

</div>

<footer>
    <p>© 2026 Glow Skin Studio | Made with Love ♡</p>
</footer>

<script>
const form = document.getElementById("skinForm");
const imageInput = document.getElementById("skinImage");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function() {
    const file = this.files[0];

    if (file && !file.type.startsWith("image/")) {
        alert("Please select a valid image.");
        this.value = "";
        preview.style.display = "none";
        return;
    }

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }
});

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const age = document.getElementById("age").value;
    const skinType = document.getElementById("skinType").value;
    const duration = document.getElementById("duration").value;
    const products = document.getElementById("products").value;
    const description = document.getElementById("description").value;

    const concerns = [...document.querySelectorAll(
        '.options input:checked'
    )].map(item => item.value);

    if (concerns.length === 0) {
        alert("Please select at least one skin concern.");
        return;
    }

    const result = document.getElementById("result");

    const safe = value => String(value || "Not provided")
        .replace(/[&<>"']/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[c]);

    result.innerHTML = `
        <h2>Thank You, ${safe(name)}! 💗</h2>
        <p><b>Email:</b> ${safe(email)}</p>
        <p><b>Phone:</b> ${safe(phone)}</p>
        <p><b>Age:</b> ${safe(age)}</p>
        <p><b>Skin Type:</b> ${safe(skinType)}</p>
        <p><b>Skin Concerns:</b> ${concerns.map(safe).join(", ")}</p>
        <p><b>Duration:</b> ${safe(duration)}</p>
        <p><b>Using Products:</b> ${safe(products)}</p>
        <p><b>Description:</b> ${safe(description)}</p>
        <p><b>Picture:</b> ${imageInput.files[0] ? safe(imageInput.files[0].name) : "Not uploaded"}</p>
        <p>Thank you for sharing your skin concerns. Our team can review your details. ♡</p>
    `;

    result.style.display = "block";
    result.scrollIntoView({ behavior: "smooth" });
});
</script>

</body>
</html>
